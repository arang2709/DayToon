<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 만화 TODO</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fdf8ee;
    --panel-empty: #f0ece0;
    --panel-done: #fff4c2;
    --accent: #ff5a5f;
    --accent-dark: #d63d42;
    --line: 4px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 14px 14px;
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, sans-serif;
    color: var(--ink);
    padding: 24px 16px 60px;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  h1 {
    text-align: center;
    font-size: 1.8rem;
    letter-spacing: -0.5px;
    margin: 0 0 4px;
    text-shadow: 2px 2px 0 var(--accent);
  }

  .subtitle { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 20px; }

  .banner {
    display: none;
    background: #fff3cd;
    border: 2px solid #e0a800;
    color: #6b5300;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.78rem;
    margin-bottom: 16px;
  }
  .banner.show { display: block; }

  .card {
    background: #fff;
    border: var(--line) solid var(--ink);
    border-radius: 10px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 16px;
    margin-bottom: 20px;
  }

  .card h2 {
    margin: 0 0 12px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--paper);
  }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: bold;
    padding: 8px 14px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button.secondary { background: #fff; color: var(--ink); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .add-form { display: flex; gap: 8px; }
  .add-form input { flex: 1; }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-bar {
    flex: 1; height: 18px; background: var(--panel-empty);
    border: 2px solid var(--ink); border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #ffc93c);
    transition: width 0.4s ease;
  }
  .progress-label { font-weight: bold; font-size: 0.85rem; min-width: 54px; text-align: right; }

  /* comic grid: fixed 2 columns */
  .comic-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: #aaa;
    font-size: 0.85rem;
    padding: 30px 0;
    border: 3px dashed #ddd;
    border-radius: 8px;
  }

  .panel {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 3px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    background: var(--panel-empty);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
  }
  /* hand-cut comic panel feel */
  .comic-grid .panel:nth-child(4n+1) { transform: rotate(-0.6deg); }
  .comic-grid .panel:nth-child(4n+2) { transform: rotate(0.5deg); }
  .comic-grid .panel:nth-child(4n+3) { transform: rotate(0.4deg); }
  .comic-grid .panel:nth-child(4n+4) { transform: rotate(-0.5deg); }

  .panel-head {
    position: absolute;
    top: 5px;
    left: 5px;
    right: 5px;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 2px 5px;
    gap: 4px;
    background: rgba(255,255,255,0.92);
    border: 2px solid var(--ink);
    border-radius: 5px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    font-size: 0.62rem;
    line-height: 1.15;
  }
  .panel-head .task-text { flex: 1; word-break: break-word; }
  .panel-head input[type="checkbox"] {
    width: 14px; height: 14px; accent-color: var(--accent);
    cursor: pointer; flex-shrink: 0;
  }
  .panel-head .del-btn {
    border: none; background: none; color: #999;
    font-size: 0.85rem; padding: 0 2px; cursor: pointer; line-height: 1;
  }
  .panel-head .del-btn:hover { color: var(--accent-dark); }

  .panel-body {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* incomplete: hatch pattern + ? */
  .panel.pending .panel-body {
    background-image: repeating-linear-gradient(
      45deg,
      rgba(0,0,0,0.15) 0,
      rgba(0,0,0,0.15) 2px,
      transparent 2px,
      transparent 9px
    );
  }
  .panel.pending .panel-body::after {
    content: "?";
    font-size: 2.4rem;
    font-weight: bold;
    color: rgba(0,0,0,0.25);
  }

  /* done: full-bleed illustration like a real comic panel */
  .panel.done { background: var(--panel-done); }

  .panel-illustration {
    position: absolute;
    inset: 0;
  }
  .panel-illustration::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.08) 1px, transparent 1.2px);
    background-size: 7px 7px;
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  .panel-illustration svg { width: 100%; height: 100%; display: block; }

  .panel-caption {
    position: absolute;
    left: 50%;
    bottom: 9px;
    transform: translateX(-50%);
    z-index: 2;
    font-size: 0.66rem;
    text-align: center;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    padding: 4px 10px;
    max-width: 86%;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.18);
  }
  .panel-caption::before {
    content: "";
    position: absolute;
    left: 16px;
    bottom: -9px;
    border: 7px solid transparent;
    border-top-color: var(--ink);
  }
  .panel-caption::after {
    content: "";
    position: absolute;
    left: 18.5px;
    bottom: -5.5px;
    border: 5px solid transparent;
    border-top-color: #fff;
  }
  .panel-caption.loading { color: #999; font-style: italic; }

  #feedbackText { font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap; }
  #feedbackText.placeholder { color: #999; font-style: italic; }
  .feedback-meta { font-size: 0.75rem; color: #999; margin-top: 8px; }

  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #ccc; border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 360px;
    overflow-y: auto;
  }
  .history-item {
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--paper);
  }
  .history-date {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-weight: bold;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .history-rate { font-weight: normal; font-size: 0.75rem; color: #888; }
  .history-bar-wrap {
    height: 8px;
    background: var(--panel-empty);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .history-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #ffc93c); }
  .history-feedback { font-size: 0.78rem; color: #444; line-height: 1.4; }
  .history-empty { text-align: center; color: #aaa; font-size: 0.85rem; padding: 20px 0; }

  footer { text-align: center; font-size: 0.72rem; color: #aaa; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>오늘의 만화 TODO</h1>
  <p class="subtitle">할 일을 끝내면 만화 칸이 채워집니다. 미루면 빈칸이 남아요.</p>

  <div class="banner" id="keyBanner">⚠️ OpenRouter API 키가 설정되지 않았습니다. index.html 상단의 <code>OPENROUTER_KEY</code> 상수를 채워주세요. 키가 없어도 앱은 기본 문구로 동작합니다.</div>

  <div class="card">
    <h2>✏️ 할 일 추가 <span style="font-weight:normal;color:#999;" id="taskCountLabel">(0/6)</span></h2>
    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="오늘 할 일을 적어보세요" maxlength="40">
      <button type="submit">추가</button>
    </form>
  </div>

  <div class="card">
    <h2>📊 달성률</h2>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>
  </div>

  <div class="card">
    <h2>🖼️ 오늘의 만화</h2>
    <div class="comic-grid" id="comicGrid"></div>
  </div>

  <div class="card">
    <h2>🌙 하루 마무리</h2>
    <div id="feedbackText" class="placeholder">버튼을 누르면 오늘 하루를 분석한 AI 피드백이 표시됩니다.</div>
    <div class="feedback-meta" id="feedbackMeta"></div>
    <div style="margin-top:10px;">
      <button id="feedbackBtn">하루 마무리</button>
    </div>
  </div>

  <div class="card">
    <h2>📅 지난 기록</h2>
    <div class="history-list" id="historyList"></div>
  </div>

  <footer>날짜가 바뀌면 자동으로 초기화됩니다 · GitHub Pages</footer>
</div>

<script>
(function () {
  "use strict";

  // ---------- OpenRouter 설정 (코드 내장 키, 사용자 입력 없음) ----------
    const OPENROUTER_KEY = "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";
  // 참고: OpenRouter 무료 모델 목록은 자주 바뀝니다. 404/400 오류가 나면
  // https://openrouter.ai/models 에서 ":free" 모델을 다시 확인해 교체하세요.
  const OPENROUTER_MODEL = "deepseek/deepseek-v4-flash-0731:free";

  const LS_DATE = "webtoon_todo_date";
  const LS_TASKS = "webtoon_todo_tasks";
  const LS_FEEDBACK = "webtoon_todo_feedback";

  let tasks = [];

  const $ = (id) => document.getElementById(id);
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const weekdayLabel = (dateStr) => {
    const [y, m, d] = dateStr.split("-").map(Number);
    return WEEKDAYS[new Date(y, m - 1, d).getDay()];
  };

  // ---------- 키워드 → 일러스트 카테고리 매칭 ----------
  const CATEGORIES = [
    { id: "exercise", label: "운동", keywords: ["운동", "헬스", "달리기", "러닝", "조깅", "요가", "수영", "축구", "농구", "필라테스", "산책", "헬스장"] },
    { id: "food", label: "음식", keywords: ["밥", "식사", "점심", "저녁", "아침식사", "요리", "다이어트", "식단", "먹기", "브런치"] },
    { id: "sleep", label: "수면", keywords: ["잠", "수면", "취침", "낮잠", "일찍자기"] },
    { id: "wake", label: "기상", keywords: ["기상", "일어나기", "알람", "미라클모닝", "일찍일어나기"] },
    { id: "study", label: "공부", keywords: ["공부", "수업", "책", "독서", "강의", "시험", "과제", "숙제", "복습"] },
    { id: "coding", label: "코딩", keywords: ["코딩", "개발", "프로그래밍", "코드", "버그", "깃", "git", "디버그", "리팩터"] },
    { id: "game", label: "게임", keywords: ["게임", "오락", "플레이", "콘솔", "닌텐도", "플스", "스팀", "롤", "오버워치"] }
  ];

  function matchCategory(text) {
    for (const cat of CATEGORIES) {
      if (cat.keywords.some((k) => text.includes(k))) return cat;
    }
    return { id: "default", label: "달성" };
  }

  // ---------- 카테고리별 인라인 SVG 일러스트 (외부 의존성 없음) ----------
  const ILLUSTRATIONS = {
    exercise: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#FFEFD8"/>

      <rect x="52" y="64" width="36" height="46" rx="12" fill="#FF5A5F"/>
      <rect x="22" y="66" width="26" height="10" rx="5" fill="#2D2D2D" transform="rotate(-20 35 71)"/>
      <rect x="92" y="66" width="26" height="10" rx="5" fill="#2D2D2D" transform="rotate(20 105 71)"/>
      <circle cx="20" cy="70" r="9" fill="#444"/>
      <circle cx="120" cy="70" r="9" fill="#444"/>
      <rect x="58" y="108" width="10" height="24" rx="4" fill="#2D2D2D"/>
      <rect x="74" y="108" width="10" height="24" rx="4" fill="#2D2D2D"/>
    </svg>`,
    food: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#FFF3E0"/>
      <path d="M22 88 a48 32 0 0 0 96 0 Z" fill="#FFC93C"/>
      <ellipse cx="70" cy="88" rx="48" ry="13" fill="#D9822B"/>
      <path d="M53 38 q-5 20 0 32" stroke="#D9822B" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M70 32 q-5 22 0 38" stroke="#D9822B" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M87 38 q5 20 0 32" stroke="#D9822B" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>`,
    sleep: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#E8E3FF"/>
      <path d="M88 28a42 42 0 1 0 22 68 34 34 0 0 1-22-68Z" fill="#5B4B9E"/>
      <circle cx="38" cy="34" r="3" fill="#5B4B9E"/>
      <circle cx="52" cy="22" r="2" fill="#5B4B9E"/>
      <text x="92" y="58" font-size="18" fill="#5B4B9E" font-family="sans-serif" font-weight="bold">Z</text>
      <text x="104" y="44" font-size="13" fill="#5B4B9E" font-family="sans-serif" font-weight="bold">z</text>
      <text x="112" y="33" font-size="9" fill="#5B4B9E" font-family="sans-serif" font-weight="bold">z</text>
    </svg>`,
    study: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#E1F5E9"/>
      <rect x="32" y="54" width="76" height="52" rx="4" fill="#2A8F4E"/>
      <rect x="32" y="54" width="38" height="52" rx="4" fill="#3FB56A"/>
      <line x1="70" y1="54" x2="70" y2="106" stroke="#1F6B3A" stroke-width="2"/>
      <line x1="41" y1="66" x2="61" y2="66" stroke="#fff" stroke-width="2" opacity="0.7"/>
      <line x1="41" y1="77" x2="61" y2="77" stroke="#fff" stroke-width="2" opacity="0.7"/>
      <line x1="79" y1="66" x2="99" y2="66" stroke="#fff" stroke-width="2" opacity="0.7"/>
      <line x1="79" y1="77" x2="99" y2="77" stroke="#fff" stroke-width="2" opacity="0.7"/>
      <rect x="60" y="26" width="6" height="30" rx="3" fill="#F4B740" transform="rotate(30 63 41)"/>
    </svg>`,
    coding: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#E4ECF7"/>
      <rect x="26" y="44" width="88" height="56" rx="6" fill="#2D2D2D"/>
      <rect x="33" y="51" width="74" height="42" rx="2" fill="#1A1A2E"/>
      <text x="70" y="80" font-size="20" fill="#3FE0A0" font-family="monospace" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>
      <rect x="18" y="100" width="104" height="8" rx="4" fill="#555"/>
    </svg>`,
    wake: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#FFF6DA"/>
      <g stroke="#F4B740" stroke-width="5" stroke-linecap="round">
        <line x1="70" y1="26" x2="70" y2="14"/>

      <rect x="18" y="88" width="104" height="8" rx="4" fill="#D9822B"/>
    </svg>`,
    game: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#EDE4FF"/>
      <path d="M40 58 h60 a20 20 0 0 1 20 24 l-4 18 a12 12 0 0 1-20 8 l-10-12 H54 l-10 12 a12 12 0 0 1-20-8 l-4-18 A20 20 0 0 1 40 58 Z" fill="#6C4BD1"/>
      <line x1="46" y1="76" x2="58" y2="76" stroke="#fff" stroke-width="3"/>
      <line x1="52" y1="70" x2="52" y2="82" stroke="#fff" stroke-width="3"/>
      <circle cx="92" cy="72" r="4" fill="#FF5A5F"/>
      <circle cx="102" cy="80" r="4" fill="#3FE0A0"/>
    </svg>`,
    default: `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="62" fill="#FFF6DA"/>
      <path d="M70 30 l10 20 22 3 -16 16 4 22 -20 -11 -20 11 4 -22 -16 -16 22 -3Z" fill="#F4B740" stroke="#D9822B" stroke-width="2"/>
    </svg>`
  };

  // ---------- state ----------
  function archiveDay(dateStr) {
    let oldTasks = [];
    let oldFeedback = null;
    try { oldTasks = JSON.parse(localStorage.getItem(LS_TASKS)) || []; } catch (e) {}
    try { oldFeedback = JSON.parse(localStorage.getItem(LS_FEEDBACK)) || null; } catch (e) {}
    if (oldTasks.length === 0) return;

    const total = oldTasks.length;
    const done = oldTasks.filter((t) => t.done).length;
    const rate = total ? Math.round((done / total) * 100) : 0;

    let history = [];
    try { history = JSON.parse(localStorage.getItem(LS_HISTORY)) || []; } catch (e) {}
    history = history.filter((h) => h.date !== dateStr);
    history.push({
      date: dateStr,
      total,
      done,
      rate,
      feedbackText: (oldFeedback && oldFeedback.date === dateStr) ? oldFeedback.text : ""
    });
    history.sort((a, b) => a.date.localeCompare(b.date));
    if (history.length > MAX_HISTORY) history = history.slice(history.length - MAX_HISTORY);
    localStorage.setItem(LS_HISTORY, JSON.stringify(history));
  }

  function loadState() {
    const savedDate = localStorage.getItem(LS_DATE);
    const today = todayStr();

    if (savedDate !== today) {
      if (savedDate) archiveDay(savedDate);
      tasks = [];
      feedback = null;
      localStorage.setItem(LS_DATE, today);
      localStorage.setItem(LS_TASKS, JSON.stringify(tasks));
      localStorage.removeItem(LS_FEEDBACK);
      return;
    }

    try { tasks = JSON.parse(localStorage.getItem(LS_TASKS)) || []; } catch (e) { tasks = []; }
    try { feedback = JSON.parse(localStorage.getItem(LS_FEEDBACK)) || null; } catch (e) { feedback = null; }

    if (tasks.length > MAX_TASKS) {
      tasks = tasks.slice(0, MAX_TASKS);
      saveTasks();
    }
  }

  function saveTasks() {
    localStorage.setItem(LS_DATE, todayStr());
    localStorage.setItem(LS_TASKS, JSON.stringify(tasks));
  }

  function saveFeedback() {
    localStorage.setItem(LS_FEEDBACK, JSON.stringify(feedback));
  }

  function hasApiKey() {
    return !!OPENROUTER_KEY && OPENROUTER_KEY !== "여기에키입력";
  }

  // ---------- OpenRouter 호출 ----------
  async function callOpenRouter(prompt, maxTokens) {
    if (!hasApiKey()) throw new Error("API 키가 설정되지 않았습니다.");

    const res = await fetch(OPENROUTER_URL, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "authorization": "Bearer " + OPENROUTER_KEY,
        "HTTP-Referer": location.origin || "https://github.com",
        "X-Title": "Webtoon Todo"
      },
      body: JSON.stringify({
        model: OPENROUTER_MODEL,
        max_tokens: maxTokens,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!res.ok) {
      const errBody = await res.text().catch(() => "");
      throw new Error(`API 오류 (${res.status}): ${errBody.slice(0, 200)}`);
    }

    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || "").trim();
  }

  async function generateCaption(task) {
    const cat = matchCategory(task.text);
    const prompt =
      `다음은 사용자가 방금 완료한 할 일입니다: "${task.text}" (분류: ${cat.label})\n` +
      `이 할 일을 완료한 순간을 표현하는 웹툰 말풍선 대사를 만들어줘.\n` +
      `조건: 20자 이내, 생동감 있는 한국어, 반말 또는 감탄사 활용 가능, 따옴표나 설명 없이 대사만 출력.`;
    try {
      task.captionLoading = true;
      renderComic();
      const caption = await callOpenRouter(prompt, 100);
      task.caption = caption || "완료!";
    } catch (e) {
      task.caption = "완료!";
      console.warn("캡션 생성 실패:", e.message);
    } finally {
      task.captionLoading = false;
      saveTasks();
      renderComic();
    }
  }

  function buildLocalFeedback(done, total, rate, pendingList) {
    return `오늘 달성률은 ${rate}%예요 (${done}/${total}개 완료). ` +
      (pendingList !== "없음" ? `아직 "${pendingList}"는 손도 안 댔네요. 내일은 미루지 말고 먼저 해치워봐요.` : "오늘은 전부 해냈어요, 최고!");
  }

  async function generateFeedback() {
    if (isGeneratingFeedback) return;

    const btn = $("feedbackBtn");
    if (tasks.length === 0) {
      alert("아직 추가된 할 일이 없습니다.");
      return;
    }

    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const rate = Math.round((done / total) * 100);
    const doneList = tasks.filter((t) => t.done).map((t) => t.text).join(", ") || "없음";
    const pendingList = tasks.filter((t) => !t.done).map((t) => t.text).join(", ") || "없음";

    isGeneratingFeedback = true;
    renderComic();
    updateAddFormState();

    if (btn) { btn.disabled = true; btn.textContent = "생성 중..."; }
    $("feedbackText").classList.remove("placeholder");
    $("feedbackText").innerHTML = '<span class="spinner"></span>피드백을 생성하는 중...';

    if (!hasApiKey()) {
      feedback = { date: todayStr(), text: buildLocalFeedback(done, total, rate, pendingList), generatedAt: new Date().toISOString() };
      saveFeedback();
      if (btn) { btn.disabled = false; btn.textContent = "하루 마무리"; }
      renderFeedback();
      isGeneratingFeedback = false;
      renderComic();
      updateAddFormState();
      return;
    }

    const prompt =
      `사용자의 오늘 하루 할 일 달성 현황입니다.\n` +
      `전체: ${total}개, 완료: ${done}개, 달성률: ${rate}%\n` +
      `완료한 항목: ${doneList}\n` +
      `미완료 항목: ${pendingList}\n\n` +
      `이 데이터를 바탕으로 하루를 마무리하는 피드백을 한국어로 2~3문장 작성해줘.\n` +
      `조건: 달성률에 대한 평가를 포함하고, 미완료 항목이 있다면 구체적으로 짚어 따끔하게 지적할 것. ` +
      `완료한 항목이 있다면 짧게라도 칭찬할 것. 너무 길게 쓰지 말 것.`;

    try {
      let text = await callOpenRouter(prompt, 300);
      if (!text || !text.trim()) {
        console.warn("AI가 빈 피드백을 반환해 로컬 피드백으로 대체합니다.");
        text = buildLocalFeedback(done, total, rate, pendingList);
      }
      feedback = { date: todayStr(), text, generatedAt: new Date().toISOString() };
      saveFeedback();
      renderFeedback();
    } catch (e) {
      console.warn("AI 피드백 생성 실패, 로컬 피드백으로 대체합니다:", e.message);
      feedback = { date: todayStr(), text: buildLocalFeedback(done, total, rate, pendingList), generatedAt: new Date().toISOString() };
      saveFeedback();
      renderFeedback();
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "하루 마무리"; }
      isGeneratingFeedback = false;
      renderComic();
      updateAddFormState();
    }
  }

  // ---------- rendering ----------
  function renderProgress() {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    $("progressFill").style.width = pct + "%";
    $("progressLabel").textContent = `${done} / ${total}`;
  }

  function renderComic() {
    const grid = $("comicGrid");
    grid.innerHTML = "";

    if (tasks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "할 일을 추가하면 만화 칸이 여기에 생겨요";
      grid.appendChild(empty);
      renderProgress();
      return;
    }

    tasks.forEach((task) => {
      const panel = document.createElement("div");
      panel.className = "panel " + (task.done ? "done" : "pending");

      const head = document.createElement("div");
      head.className = "panel-head";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.disabled = isGeneratingFeedback;
      checkbox.addEventListener("change", () => toggleTask(task.id));

      const textSpan = document.createElement("span");
      textSpan.className = "task-text";
      textSpan.textContent = task.text;

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "×";
      delBtn.title = "삭제";
      delBtn.disabled = isGeneratingFeedback;
      delBtn.addEventListener("click", () => deleteTask(task.id));

      head.appendChild(checkbox);
      head.appendChild(textSpan);
      head.appendChild(delBtn);

      const body = document.createElement("div");
      body.className = "panel-body";

      if (task.done) {
        const illust = document.createElement("div");
        illust.className = "panel-illustration";
        const cat = matchCategory(task.text);
        illust.innerHTML = ILLUSTRATIONS[cat.id] || ILLUSTRATIONS.default;
        body.appendChild(illust);

        const caption = document.createElement("div");
        if (task.captionLoading) {
          caption.className = "panel-caption loading";
          caption.textContent = "대사 생성 중...";
        } else {
          caption.className = "panel-caption";
          caption.textContent = task.caption || "완료!";
        }
        body.appendChild(caption);
      }

      panel.appendChild(head);
      panel.appendChild(body);
      grid.appendChild(panel);
    });

    renderProgress();
  }

  function renderFeedback() {
    const el = $("feedbackText");
    const meta = $("feedbackMeta");
    if (feedback && feedback.date === todayStr()) {
      el.classList.remove("placeholder");
      el.textContent = feedback.text;
      const t = new Date(feedback.generatedAt);
      meta.textContent = `생성 시각: ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")}`;
    } else {
      el.classList.add("placeholder");
      el.textContent = "버튼을 누르면 오늘 하루를 분석한 AI 피드백이 표시됩니다.";
      meta.textContent = "";
    }
  }

  function renderHistory() {
    let history = [];
    try { history = JSON.parse(localStorage.getItem(LS_HISTORY)) || []; } catch (e) {}

    const container = $("historyList");
    container.innerHTML = "";

    if (history.length === 0) {
      const empty = document.createElement("div");
      empty.className = "history-empty";
      empty.textContent = "아직 지난 기록이 없어요. 오늘 하루가 지나면 여기에 쌓여요.";
      container.appendChild(empty);
      return;
    }

    history.slice().reverse().forEach((h) => {
      const item = document.createElement("div");
      item.className = "history-item";

      const [y, m, d] = h.date.split("-");
      const dateEl = document.createElement("div");
      dateEl.className = "history-date";
      dateEl.textContent = `${Number(m)}월 ${Number(d)}일 (${weekdayLabel(h.date)})`;

      const rateEl = document.createElement("span");
      rateEl.className = "history-rate";
      rateEl.textContent = `${h.done}/${h.total} · ${h.rate}%`;
      dateEl.appendChild(rateEl);

      const barWrap = document.createElement("div");
      barWrap.className = "history-bar-wrap";
      const bar = document.createElement("div");
      bar.className = "history-bar";
      bar.style.width = h.rate + "%";
      barWrap.appendChild(bar);

      const fbEl = document.createElement("div");
      fbEl.className = "history-feedback";
      fbEl.textContent = h.feedbackText || "피드백 기록 없음";

      item.appendChild(dateEl);
      item.appendChild(barWrap);
      item.appendChild(fbEl);
      container.appendChild(item);
    });
  }

  // ---------- task operations ----------
  function updateAddFormState() {
    const full = tasks.length >= MAX_TASKS;
    const locked = isGeneratingFeedback;
    $("taskCountLabel").textContent = `(${tasks.length}/${MAX_TASKS})`;
    $("taskInput").disabled = full || locked;
    $("taskInput").placeholder = locked
      ? "피드백 생성 중에는 수정할 수 없어요"
      : (full ? `최대 ${MAX_TASKS}개까지 추가했어요` : "오늘 할 일을 적어보세요");
    const submitBtn = $("addForm").querySelector("button[type=submit]");
    if (submitBtn) submitBtn.disabled = full || locked;
  }

  function addTask(text) {
    if (isGeneratingFeedback) return;
    if (tasks.length >= MAX_TASKS) {
      alert(`할 일은 최대 ${MAX_TASKS}개까지 추가할 수 있습니다.`);
      return;
    }
    const trimmed = text.trim();
    if (!trimmed) return;
    tasks.push({
      id: Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      text: trimmed,
      done: false,
      caption: "",
      captionLoading: false
    });
    saveTasks();
    renderComic();
    updateAddFormState();
  }

  function toggleTask(id) {
    if (isGeneratingFeedback) return;
    const task = tasks.find((t) => t.id === id);
    if (!task) return;
    task.done = !task.done;
    saveTasks();
    renderComic();
    if (task.done && !task.caption) {
      generateCaption(task);
    }
  }

  function deleteTask(id) {
    if (isGeneratingFeedback) return;
    tasks = tasks.filter((t) => t.id !== id);
    saveTasks();
    renderComic();
    updateAddFormState();
  }

  // ---------- midnight rollover watcher ----------
  function checkDateRollover() {
    const savedDate = localStorage.getItem(LS_DATE);
    if (savedDate !== todayStr()) {
      loadState();
      renderComic();
      renderFeedback();
      updateAddFormState();
      renderHistory();
    }
  }

  // ---------- init ----------
  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("taskInput");
    addTask(input.value);
    input.value = "";
  });

  $("feedbackBtn").addEventListener("click", generateFeedback);

  $("keyBanner").classList.toggle("show", !hasApiKey());

  loadState();
  renderComic();
  renderFeedback();
  updateAddFormState();
  renderHistory();

  setInterval(checkDateRollover, 60 * 1000);
})();
</script>
</body>
</html>
