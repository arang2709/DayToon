<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayToon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFF8E7;
    --card: #FFFDF6;
    --ink: #4A3B2A;
    --ink-soft: #94826A;
    --red: #E85555;
    --yellow: #F5C842;
    --green: #5BAD6F;
    --sky: #5B9AD5;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: #EFE6D0;
    background-image: radial-gradient(rgba(74,59,42,0.05) 1px, transparent 1.2px);
    background-size: 16px 16px;
    font-family: "Noto Sans KR", sans-serif;
    color: var(--ink);
  }

  .app {
    max-width: 390px;
    margin: 0 auto;
    height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 0 1px rgba(74,59,42,0.08);
    position: relative;
  }

  header.top {
    flex-shrink: 0;
    text-align: center;
    padding: 14px 12px 10px;
    border-bottom: 3px solid var(--ink);
    background: var(--paper);
  }
  header.top h1 { margin: 0; font-size: 1.5rem; font-weight: 900; }
  header.top .today { font-size: 0.75rem; color: var(--ink-soft); margin-top: 2px; font-weight: 500; }

  .banner {
    display: none;
    background: #FFF3CD;
    border: 2px dashed #D9A62E;
    color: #6b5300;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 0.7rem;
    margin: 8px 12px 0;
  }
  .banner.show { display: block; }

  main.screens { flex: 1; overflow-y: auto; padding: 14px 14px 24px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadein 0.15s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .screen-title { font-size: 1.05rem; font-weight: 900; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }

  .card {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 rgba(74,59,42,0.16);
    padding: 14px;
    margin-bottom: 14px;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: 0.92rem;
    padding: 9px 11px;
    border: 2.5px solid var(--ink);
    border-radius: 9px;
    background: var(--paper);
    color: var(--ink);
    width: 100%;
  }

  button {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    padding: 9px 16px;
    border: 2.5px solid var(--ink);
    border-radius: 10px;
    background: var(--yellow);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(74,59,42,0.35);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  button:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 rgba(74,59,42,0.35); }
  button:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(74,59,42,0.35); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 rgba(74,59,42,0.2); }
  button.block { width: 100%; }
  button.sky { background: var(--sky); color: #fff; }
  button.green { background: var(--green); color: #fff; }
  button.ghost { background: var(--paper); box-shadow: none; }

  label.field-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); margin: 10px 0 4px; }

  .star-row { display: flex; gap: 6px; }
  .star-btn {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    font-size: 1.1rem; padding: 4px 10px; box-shadow: 2px 2px 0 rgba(74,59,42,0.25); color: #d8cdb8;
  }
  .star-btn.filled { color: var(--red); }

  .task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .task-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--paper); border: 2.5px solid var(--ink);
    border-radius: 10px; padding: 8px 10px; font-size: 0.88rem;
  }
  .task-row.done .task-text { text-decoration: line-through; color: var(--ink-soft); }
  .task-row .task-text { flex: 1; word-break: break-word; }
  .task-row .task-icon { font-size: 1.1rem; flex-shrink: 0; }
  .task-row .stars { font-size: 0.7rem; color: var(--red); white-space: nowrap; }
  .task-row .stars .empty { color: #d8cdb8; }
  .task-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--red); cursor: pointer; flex-shrink: 0; }
  .task-row .task-text { cursor: text; }
  .task-row .edit-btn, .task-row .del-btn {
    border: none; background: none; color: var(--ink-soft); box-shadow: none;
    font-size: 1rem; padding: 0 2px; cursor: pointer; line-height: 1; flex-shrink: 0;
  }
  .task-row .edit-btn:hover { color: var(--sky); }
  .task-row .del-btn { font-size: 1.1rem; }
  .task-row .del-btn:hover { color: var(--red); }
  .task-row .edit-input {
    flex: 1; font-family: inherit; font-size: 0.88rem; padding: 3px 7px;
    border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); min-width: 0;
  }

  .empty-hint { text-align: center; color: var(--ink-soft); font-size: 0.82rem; padding: 26px 10px; }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .progress-bar {
    flex: 1; height: 16px; background: var(--paper);
    border: 2.5px solid var(--ink); border-radius: 9px; overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--sky), var(--green)); transition: width 0.4s ease; }
  .progress-label { font-weight: 700; font-size: 0.82rem; min-width: 46px; text-align: right; }

  .comic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .panel {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 3px solid var(--ink);
    border-radius: 12px;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 3px 3px 0 rgba(74,59,42,0.2);
    display: flex; align-items: center; justify-content: center;
  }

  .panel.empty-slot { border-style: dashed; background: rgba(74,59,42,0.03); }
  .panel.empty-slot::after { content: "다음 페이지를\A 기다리는 중"; white-space: pre; text-align: center; font-size: 0.66rem; color: rgba(74,59,42,0.35); font-weight: 700; }

  .panel.pending { background: #EAF3FC; border-color: var(--sky); border-style: dashed; }
  .stamp {
    border: 3px double var(--sky);
    color: var(--sky);
    font-weight: 900;
    padding: 6px 10px;
    border-radius: 6px;
    transform: rotate(-9deg);
    opacity: 0.88;
    letter-spacing: 1px;
    font-size: 0.85rem;
    text-align: center;
  }
  .pending-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pending-dog { font-size: 1.6rem; }
  .pending-note { font-size: 0.6rem; color: var(--sky); font-weight: 700; }

  .panel.done { flex-direction: column; gap: 4px; padding: 8px; }
  .panel-emoji { font-size: 2.6rem; line-height: 1; }
  .panel-caption {
    font-size: 0.68rem; text-align: center; background: #fff;
    border: 2px solid var(--ink); border-radius: 12px; padding: 3px 8px; max-width: 100%;
    box-shadow: 2px 2px 0 rgba(74,59,42,0.2);
  }
  .panel-caption.loading { color: var(--ink-soft); font-style: italic; }

  .panel-head {
    position: absolute; top: 4px; left: 4px; right: 4px; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.58rem; background: rgba(255,253,246,0.9); border: 1.5px solid var(--ink);
    border-radius: 6px; padding: 1px 4px; gap: 3px;
  }
  .panel-head .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .feedback-box { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; padding: 12px; }
  .feedback-box .mascot { font-size: 1.7rem; flex-shrink: 0; }
  #feedbackText { font-size: 0.9rem; line-height: 1.55; white-space: pre-wrap; }
  #feedbackText.placeholder { color: var(--ink-soft); font-style: italic; }
  .feedback-meta { font-size: 0.7rem; color: var(--ink-soft); margin-top: 6px; }

  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: var(--sky); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .archive-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thumb {
    aspect-ratio: 1/1; border: 2.5px solid var(--ink); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; box-shadow: 2px 2px 0 rgba(74,59,42,0.2); padding: 4px;
    background: var(--card);
  }
  .thumb .rate { font-weight: 900; font-size: 1rem; }
  .thumb .date { font-size: 0.58rem; color: var(--ink-soft); font-weight: 700; }
  .thumb .mini-emojis { font-size: 0.7rem; letter-spacing: 1px; }

  .archive-empty { text-align: center; color: var(--ink-soft); font-size: 0.85rem; padding: 26px 10px; grid-column: 1 / -1; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(74,59,42,0.55);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card); border: 3px solid var(--ink); border-radius: 16px;
    box-shadow: 5px 5px 0 rgba(74,59,42,0.3); padding: 16px; max-width: 360px; width: 100%;
    max-height: 82vh; overflow-y: auto;
  }
  .modal-box h3 { margin: 0 0 10px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .modal-box .close-btn { padding: 4px 10px; font-size: 0.8rem; }
  .modal-box .comic-grid { margin-bottom: 10px; }
  .modal-feedback { font-size: 0.82rem; line-height: 1.5; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; }

  nav.bottom-nav {
    flex-shrink: 0; display: flex; border-top: 3px solid var(--ink); background: var(--card);
  }
  nav.bottom-nav button {
    flex: 1; border: none; border-radius: 0; background: transparent; box-shadow: none;
    padding: 8px 4px 10px; font-size: 0.68rem; font-weight: 700; color: var(--ink-soft);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav.bottom-nav button .icon { font-size: 1.25rem; }
  nav.bottom-nav button.active { color: var(--red); }
  nav.bottom-nav button:hover { transform: none; box-shadow: none; }
  nav.bottom-nav button:active { transform: none; box-shadow: none; }

  @media (max-width: 400px) { .app { max-width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>🐾 DayToon</h1>
    <div class="today" id="todayLabel"></div>
    <div class="banner" id="keyBanner">⚠️ OpenRouter API 키/모델이 비어있어요. index.html 상단의 <code>OPENROUTER_KEY</code>, <code>OPENROUTER_MODEL</code>을 채워주세요. 없어도 기본 문구로 동작해요.</div>
  </header>

  <main class="screens">

    <!-- 홈 화면: 할 일 입력 -->
    <section class="screen active" id="screen-home">
      <h2 class="screen-title">✏️ 오늘 할 일 추가</h2>
      <div class="card">
        <form id="addForm">
          <input type="text" id="taskInput" placeholder="오늘 할 일을 적어보세요" maxlength="20">
          <label class="field-label">중요도</label>
          <div class="star-row" id="starRow">
            <button type="button" class="star-btn" data-value="1">★</button>
            <button type="button" class="star-btn" data-value="2">★</button>
            <button type="button" class="star-btn" data-value="3">★</button>
          </div>
          <button type="submit" class="block" style="margin-top:12px;" id="addSubmitBtn">추가하기</button>
        </form>
      </div>
      <div class="card" id="homeListCard">
        <label class="field-label" style="margin-top:0;">오늘 추가한 할 일 <span id="homeCountLabel"></span></label>
        <ul class="task-list" id="homeTaskList"></ul>
      </div>
    </section>

    <!-- 할 일 화면: 체크 목록 + 출판 -->
    <section class="screen" id="screen-tasks">
      <h2 class="screen-title">✅ 오늘의 할 일</h2>
      <div class="card">
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-label" id="progressLabel">0 / 0</div>
        </div>
        <ul class="task-list" id="taskCheckList"></ul>
      </div>
      <button class="block sky" id="publishBtn">📖 출판하기</button>
    </section>

    <!-- 그림일기 화면: 4컷 -->
    <section class="screen" id="screen-diary">
      <h2 class="screen-title">📖 오늘의 그림일기</h2>
      <div class="card">
        <div class="comic-grid" id="comicGrid"></div>
      </div>
      <div class="card">
        <div class="feedback-box">
          <span class="mascot">🐶</span>
          <div style="flex:1;">
            <div id="feedbackText" class="placeholder">할 일 화면에서 "출판하기"를 누르면 다정한 코멘트가 도착해요.</div>
            <div class="feedback-meta" id="feedbackMeta"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 보관함 화면 -->
    <section class="screen" id="screen-archive">
      <h2 class="screen-title">🗂 보관함</h2>
      <div class="archive-grid" id="archiveGrid"></div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button data-screen="home" class="active"><span class="icon">🏠</span>홈</button>
    <button data-screen="tasks"><span class="icon">✅</span>할 일</button>
    <button data-screen="diary"><span class="icon">📖</span>일기</button>
    <button data-screen="archive"><span class="icon">🗂</span>보관함</button>
  </nav>

  <div class="modal-overlay" id="archiveModal">
    <div class="modal-box">
      <h3><span id="modalDate"></span><button class="close-btn" id="modalCloseBtn">닫기 ×</button></h3>
      <div class="comic-grid" id="modalGrid"></div>
      <div class="modal-feedback" id="modalFeedback"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- OpenRouter 설정 (코드 내장 키, 사용자 입력 없음) ----------
  const OPENROUTER_KEY = "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";
  // 참고: OpenRouter 무료 모델 목록은 자주 바뀝니다. https://openrouter.ai/models 에서
  // 현재 존재하는 ":free" 모델 슬러그인지 확인 후 사용하세요. 없는 슬러그는 400/404 에러가 납니다.
  const OPENROUTER_MODEL = "google/gemma-4-26b-a4b-it:free";
  const OPENROUTER_URL = "https://openrouter.ai/api/v1/chat/completions";

  const LS_DATE = "daytoon_date";
  const LS_TASKS = "daytoon_tasks";
  const LS_FEEDBACK = "daytoon_feedback";
  const LS_ARCHIVE = "daytoon_archive";
  const MAX_TASKS = 4;
  const MAX_ARCHIVE = 60;
  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const PENDING_NOTES = ["내일 다시 만나요!", "조금만 기다려 줄게!", "내일 그리면 돼요!", "천천히 해도 괜찮아요!"];

  let tasks = [];
  let feedback = null; // { date, text, generatedAt }
  let isGeneratingFeedback = false;
  let newTaskStars = 2;

  const $ = (id) => document.getElementById(id);
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const weekdayLabel = (dateStr) => {
    const [y, m, d] = dateStr.split("-").map(Number);
    return WEEKDAYS[new Date(y, m - 1, d).getDay()];
  };
  const formatDateLabel = (dateStr) => {
    const [y, m, d] = dateStr.split("-");
    return `${Number(m)}월 ${Number(d)}일 (${weekdayLabel(dateStr)})`;
  };
  const noteFor = (id) => {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PENDING_NOTES[h % PENDING_NOTES.length];
  };
  const starString = (n) => "★".repeat(n) + '<span class="empty">' + "★".repeat(3 - n) + "</span>";

  // ---------- 키워드 → 이모지 카테고리 매칭 ----------
  const CATEGORIES = [
    { id: "exercise", emoji: "🏃", label: "운동", keywords: ["운동", "헬스", "달리기", "러닝", "조깅", "요가", "수영", "산책", "필라테스"] },
    { id: "food", emoji: "🍱", label: "식사", keywords: ["밥", "식사", "점심", "저녁", "아침식사", "요리", "브런치", "먹기"] },
    { id: "sleep", emoji: "😴", label: "수면", keywords: ["잠", "수면", "취침", "낮잠", "일찍자기"] },
    { id: "study", emoji: "📚", label: "공부", keywords: ["공부", "수업", "책", "독서", "강의", "시험", "과제", "숙제", "복습"] },
    { id: "coding", emoji: "💻", label: "코딩", keywords: ["코딩", "개발", "프로그래밍", "코드", "버그", "깃", "git", "디버그"] },
    { id: "meeting", emoji: "💬", label: "회의", keywords: ["회의", "미팅", "발표", "면담", "상담"] },
    { id: "clean", emoji: "🧹", label: "청소", keywords: ["청소", "정리", "빨래", "설거지"] },
    { id: "friend", emoji: "👫", label: "만남", keywords: ["친구", "만남", "약속", "데이트", "모임"] }
  ];

  function matchCategory(text) {
    for (const cat of CATEGORIES) {
      if (cat.keywords.some((k) => text.includes(k))) return cat;
    }
    return { id: "default", emoji: "⭐", label: "달성" };
  }
  function emojiFor(text) {
    return matchCategory(text).emoji;
  }

  // ---------- 저장 / 보관함 ----------
  function archiveDay(dateStr) {
    let oldTasks = [];
    let oldFeedback = null;
    try { oldTasks = JSON.parse(localStorage.getItem(LS_TASKS)) || []; } catch (e) {}
    try { oldFeedback = JSON.parse(localStorage.getItem(LS_FEEDBACK)) || null; } catch (e) {}
    if (oldTasks.length === 0) return;

    const total = oldTasks.length;
    const done = oldTasks.filter((t) => t.done).length;
    const rate = total ? Math.round((done / total) * 100) : 0;

    let archive = [];
    try { archive = JSON.parse(localStorage.getItem(LS_ARCHIVE)) || []; } catch (e) {}
    archive = archive.filter((a) => a.date !== dateStr);
    archive.push({
      date: dateStr,
      total,
      done,
      rate,
      tasks: oldTasks,
      feedbackText: (oldFeedback && oldFeedback.date === dateStr) ? oldFeedback.text : ""
    });
    archive.sort((a, b) => a.date.localeCompare(b.date));
    if (archive.length > MAX_ARCHIVE) archive = archive.slice(archive.length - MAX_ARCHIVE);
    localStorage.setItem(LS_ARCHIVE, JSON.stringify(archive));
  }

  function loadState() {
    const savedDate = localStorage.getItem(LS_DATE);
    const today = todayStr();

    if (savedDate !== today) {
      if (savedDate) archiveDay(savedDate);
      tasks = [];
      feedback = null;
      localStorage.setItem(LS_DATE, today);
      localStorage.setItem(LS_TASKS, JSON.stringify(tasks));
      localStorage.removeItem(LS_FEEDBACK);
      return;
    }

    try { tasks = JSON.parse(localStorage.getItem(LS_TASKS)) || []; } catch (e) { tasks = []; }
    try { feedback = JSON.parse(localStorage.getItem(LS_FEEDBACK)) || null; } catch (e) { feedback = null; }

    if (tasks.length > MAX_TASKS) {
      tasks = tasks.slice(0, MAX_TASKS);
      saveTasks();
    }
  }

  function saveTasks() {
    localStorage.setItem(LS_DATE, todayStr());
    localStorage.setItem(LS_TASKS, JSON.stringify(tasks));
  }

  function saveFeedback() {
    localStorage.setItem(LS_FEEDBACK, JSON.stringify(feedback));
  }

  function hasApiKey() {
    return !!OPENROUTER_KEY && !!OPENROUTER_MODEL && OPENROUTER_MODEL !== "여기에모델슬러그입력";
  }

  // ---------- OpenRouter 호출 ----------
  async function callOpenRouter(prompt, maxTokens) {
    if (!hasApiKey()) throw new Error("API 키 또는 모델이 설정되지 않았습니다.");

    const res = await fetch(OPENROUTER_URL, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "authorization": "Bearer " + OPENROUTER_KEY,
        "HTTP-Referer": location.origin || "https://github.com",
        "X-Title": "DayToon"
      },
      body: JSON.stringify({
        model: OPENROUTER_MODEL,
        max_tokens: maxTokens,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!res.ok) {
      const errBody = await res.text().catch(() => "");
      throw new Error(`API 오류 (${res.status}): ${errBody.slice(0, 200)}`);
    }

    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || "").trim();
  }

  async function generateCaption(task) {
    const cat = matchCategory(task.text);
    task.category = cat.id;
    const prompt =
      `방금 완료한 할 일: "${task.text}" (분류: ${cat.label})\n` +
      `이 순간을 그림일기 말풍선 대사로 표현해줘.\n` +
      `조건: 20자 이내, 따뜻하고 다정한 한국어, 반말이나 감탄사 활용 가능, 따옴표나 설명 없이 대사만 출력.`;
    try {
      task.captionLoading = true;
      renderComic();
      const caption = await callOpenRouter(prompt, 100);
      task.caption = caption || "오늘도 해냈다!";
    } catch (e) {
      task.caption = "오늘도 해냈다!";
      console.warn("캡션 생성 실패:", e.message);
    } finally {
      task.captionLoading = false;
      saveTasks();
      renderComic();
    }
  }

  function buildLocalFeedback(done, total, rate, pendingList) {
    if (rate === 100) {
      return `오늘은 ${total}개 모두 그림으로 채웠어요! 정말 근사한 하루였어요.`;
    }
    if (done === 0) {
      return `오늘은 아직 그려진 페이지가 없어요. "${pendingList}"는 원고 미도착이지만, 내일 다시 펼치면 돼요.`;
    }
    return `오늘은 ${done}/${total}개를 완성했어요 (${rate}%). "${pendingList}"는 원고 미도착으로 남았지만 내일 다시 그리면 되니까 괜찮아요.`;
  }

  async function generateFeedback() {
    if (isGeneratingFeedback) return;

    if (tasks.length === 0) {
      alert("아직 추가된 할 일이 없어요. 홈 화면에서 먼저 추가해주세요.");
      return;
    }

    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const rate = Math.round((done / total) * 100);
    const doneList = tasks.filter((t) => t.done).map((t) => t.text).join(", ") || "없음";
    const pendingList = tasks.filter((t) => !t.done).map((t) => t.text).join(", ") || "없음";

    isGeneratingFeedback = true;
    const btn = $("publishBtn");
    if (btn) { btn.disabled = true; btn.textContent = "출판 중..."; }
    renderTaskCheckList();

    if (!hasApiKey()) {
      feedback = { date: todayStr(), text: buildLocalFeedback(done, total, rate, pendingList), generatedAt: new Date().toISOString() };
      saveFeedback();
      finishPublish(btn);
      return;
    }

    const prompt =
      `사용자의 오늘 하루 할 일 달성 현황입니다.\n` +
      `전체: ${total}개, 완료: ${done}개, 달성률: ${rate}%\n` +
      `완료한 항목: ${doneList}\n` +
      `미완료 항목: ${pendingList}\n\n` +
      `이 데이터를 바탕으로 하루를 마무리하는 그림일기 피드백을 한국어 2문장으로 작성해줘.\n` +
      `조건: 항상 다정하고 따뜻한 톤을 유지할 것. 완료한 항목은 짧게 칭찬할 것. ` +
      `미완료 항목이 있다면 명확히 언급하되, 절대 꾸짖거나 다그치지 말고 ` +
      `"내일 다시 그리면 돼요" 같은 다정한 격려로 마무리할 것.`;

    try {
      let text = await callOpenRouter(prompt, 300);
      if (!text || !text.trim()) text = buildLocalFeedback(done, total, rate, pendingList);
      feedback = { date: todayStr(), text, generatedAt: new Date().toISOString() };
      saveFeedback();
    } catch (e) {
      console.warn("AI 피드백 생성 실패, 기본 문구로 대체합니다:", e.message);
      feedback = { date: todayStr(), text: buildLocalFeedback(done, total, rate, pendingList), generatedAt: new Date().toISOString() };
      saveFeedback();
    } finally {
      finishPublish(btn);
    }
  }

  function finishPublish(btn) {
    if (btn) { btn.disabled = false; btn.textContent = "📖 출판하기"; }
    isGeneratingFeedback = false;
    renderTaskCheckList();
    renderComic();
    renderFeedback();
    showScreen("diary");
  }

  // ---------- rendering: 공용 패널 빌더 ----------
  function buildPanel(task, interactive) {
    const panel = document.createElement("div");

    if (!task) {
      panel.className = "panel empty-slot";
      return panel;
    }

    panel.className = "panel " + (task.done ? "done" : "pending");

    if (interactive) {
      const head = document.createElement("div");
      head.className = "panel-head";
      head.innerHTML = `<span class="t">${task.text}</span>`;
      panel.appendChild(head);
    }

    if (task.done) {
      const emoji = document.createElement("div");
      emoji.className = "panel-emoji";
      emoji.textContent = emojiFor(task.text);
      panel.appendChild(emoji);

      const caption = document.createElement("div");
      if (task.captionLoading) {
        caption.className = "panel-caption loading";
        caption.textContent = "대사 생성 중...";
      } else {
        caption.className = "panel-caption";
        caption.textContent = task.caption || "오늘도 해냈다!";
      }
      panel.appendChild(caption);
    } else {
      const wrap = document.createElement("div");
      wrap.className = "pending-wrap";
      wrap.innerHTML =
        `<span class="pending-dog">🐶</span>` +
        `<span class="stamp">원고 미도착</span>` +
        `<span class="pending-note">${noteFor(task.id)}</span>`;
      panel.appendChild(wrap);
    }

    return panel;
  }

  function renderComic() {
    const grid = $("comicGrid");
    grid.innerHTML = "";
    for (let i = 0; i < MAX_TASKS; i++) {
      grid.appendChild(buildPanel(tasks[i] || null, true));
    }
  }

  // ---------- 홈 화면 ----------
  function renderHomeList() {
    const list = $("homeTaskList");
    list.innerHTML = "";
    $("homeCountLabel").textContent = `(${tasks.length}/${MAX_TASKS})`;
    if (tasks.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "아직 추가한 할 일이 없어요.";
      list.appendChild(hint);
      return;
    }
    tasks.forEach((task) => {
      const row = document.createElement("li");
      row.className = "task-row" + (task.done ? " done" : "");

      const icon = document.createElement("span");
      icon.className = "task-icon";
      icon.textContent = emojiFor(task.text);

      const stars = document.createElement("span");
      stars.className = "stars";
      stars.innerHTML = starString(task.priority);

      const textSpan = document.createElement("span");
      textSpan.className = "task-text";
      textSpan.textContent = task.text;
      textSpan.title = "탭하여 수정";
      textSpan.addEventListener("click", () => startEditTask(task.id, textSpan));

      const editBtn = document.createElement("button");
      editBtn.className = "edit-btn";
      editBtn.title = "수정";
      editBtn.textContent = "✎";
      editBtn.addEventListener("click", () => startEditTask(task.id, textSpan));

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.title = "삭제";
      delBtn.textContent = "×";
      delBtn.addEventListener("click", () => deleteTask(task.id));

      row.appendChild(icon);
      row.appendChild(stars);
      row.appendChild(textSpan);
      row.appendChild(editBtn);
      row.appendChild(delBtn);
      list.appendChild(row);
    });
  }

  function startEditTask(id, textSpan) {
    const task = tasks.find((t) => t.id === id);
    if (!task) return;

    const input = document.createElement("input");
    input.type = "text";
    input.className = "edit-input";
    input.maxLength = 20;
    input.value = task.text;
    textSpan.replaceWith(input);
    input.focus();
    input.select();

    let committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      const val = input.value.trim();
      if (val) {
        task.text = val;
        saveTasks();
      }
      renderHomeList();
      renderTaskCheckList();
      renderComic();
    }
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { e.preventDefault(); committed = true; renderHomeList(); }
    });
    input.addEventListener("blur", commit);
  }

  function updateAddFormState() {
    const full = tasks.length >= MAX_TASKS;
    $("taskInput").disabled = full;
    $("taskInput").placeholder = full ? `오늘은 ${MAX_TASKS}개까지 채웠어요` : "오늘 할 일을 적어보세요";
    $("addSubmitBtn").disabled = full;
  }

  function renderStars() {
    document.querySelectorAll("#starRow .star-btn").forEach((btn) => {
      btn.classList.toggle("filled", Number(btn.dataset.value) <= newTaskStars);
    });
  }

  // ---------- 할 일 화면 ----------
  function renderProgress() {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    $("progressFill").style.width = pct + "%";
    $("progressLabel").textContent = `${done} / ${total}`;
  }

  function renderTaskCheckList() {
    const list = $("taskCheckList");
    list.innerHTML = "";
    renderProgress();
    if (tasks.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "홈 화면에서 오늘 할 일을 먼저 추가해보세요.";
      list.appendChild(hint);
      return;
    }
    tasks.forEach((task) => {
      const row = document.createElement("li");
      row.className = "task-row" + (task.done ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.disabled = isGeneratingFeedback;
      checkbox.addEventListener("change", () => toggleTask(task.id));

      const icon = document.createElement("span");
      icon.className = "task-icon";
      icon.textContent = emojiFor(task.text);

      const stars = document.createElement("span");
      stars.className = "stars";
      stars.innerHTML = starString(task.priority);

      const textSpan = document.createElement("span");
      textSpan.className = "task-text";
      textSpan.textContent = task.text;

      row.appendChild(checkbox);
      row.appendChild(icon);
      row.appendChild(stars);
      row.appendChild(textSpan);
      list.appendChild(row);
    });
  }

  // ---------- 그림일기 화면 ----------
  function renderFeedback() {
    const el = $("feedbackText");
    const meta = $("feedbackMeta");
    if (feedback && feedback.date === todayStr()) {
      el.classList.remove("placeholder");
      el.textContent = feedback.text;
      const t = new Date(feedback.generatedAt);
      meta.textContent = `출판 시각: ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")}`;
    } else {
      el.classList.add("placeholder");
      el.textContent = '할 일 화면에서 "출판하기"를 누르면 다정한 코멘트가 도착해요.';
      meta.textContent = "";
    }
  }

  // ---------- 보관함 화면 ----------
  function loadArchive() {
    try { return JSON.parse(localStorage.getItem(LS_ARCHIVE)) || []; } catch (e) { return []; }
  }

  function renderArchiveGrid() {
    const archive = loadArchive();
    const grid = $("archiveGrid");
    grid.innerHTML = "";

    if (archive.length === 0) {
      const empty = document.createElement("div");
      empty.className = "archive-empty";
      empty.textContent = "아직 보관된 페이지가 없어요. 오늘이 지나면 여기에 쌓여요.";
      grid.appendChild(empty);
      return;
    }

    archive.slice().reverse().forEach((entry) => {
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const emojis = (entry.tasks || []).filter((t) => t.done).map((t) => emojiFor(t.text)).join("") || "🐶";
      thumb.innerHTML =
        `<div class="mini-emojis">${emojis}</div>` +
        `<div class="rate">${entry.rate}%</div>` +
        `<div class="date">${formatDateLabel(entry.date)}</div>`;
      thumb.addEventListener("click", () => openArchiveModal(entry));
      grid.appendChild(thumb);
    });
  }

  function openArchiveModal(entry) {
    $("modalDate").textContent = "📖 " + formatDateLabel(entry.date) + ` · ${entry.done}/${entry.total} (${entry.rate}%)`;
    const grid = $("modalGrid");
    grid.innerHTML = "";
    const t = entry.tasks || [];
    for (let i = 0; i < MAX_TASKS; i++) {
      grid.appendChild(buildPanel(t[i] || null, true));
    }
    $("modalFeedback").textContent = "🐶 " + (entry.feedbackText || "그날의 코멘트가 기록되지 않았어요.");
    $("archiveModal").classList.add("show");
  }

  // ---------- task operations ----------
  function addTask(text) {
    if (tasks.length >= MAX_TASKS) {
      alert(`할 일은 오늘 최대 ${MAX_TASKS}개까지 추가할 수 있어요.`);
      return;
    }
    const trimmed = text.trim();
    if (!trimmed) return;
    tasks.push({
      id: Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      text: trimmed,
      priority: newTaskStars,
      done: false,
      category: "",
      caption: "",
      captionLoading: false
    });
    saveTasks();
    renderHomeList();
    updateAddFormState();
    renderTaskCheckList();
    renderComic();
  }

  function toggleTask(id) {
    if (isGeneratingFeedback) return;
    const task = tasks.find((t) => t.id === id);
    if (!task) return;
    task.done = !task.done;
    saveTasks();
    renderTaskCheckList();
    renderComic();
    renderHomeList();
    if (task.done && !task.caption) {
      generateCaption(task);
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter((t) => t.id !== id);
    saveTasks();
    renderHomeList();
    updateAddFormState();
    renderTaskCheckList();
    renderComic();
  }

  // ---------- 화면 전환 ----------
  function showScreen(name) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === "screen-" + name));
    document.querySelectorAll(".bottom-nav button").forEach((b) => b.classList.toggle("active", b.dataset.screen === name));
    if (name === "archive") renderArchiveGrid();
  }

  // ---------- 자정 감지 ----------
  function checkDateRollover() {
    const savedDate = localStorage.getItem(LS_DATE);
    if (savedDate !== todayStr()) {
      loadState();
      renderAll();
    }
  }

  function renderAll() {
    $("todayLabel").textContent = formatDateLabel(todayStr());
    renderHomeList();
    updateAddFormState();
    renderTaskCheckList();
    renderComic();
    renderFeedback();
    renderArchiveGrid();
  }

  // ---------- init ----------
  document.querySelectorAll("#starRow .star-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      newTaskStars = Number(btn.dataset.value);
      renderStars();
    });
  });

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("taskInput");
    addTask(input.value);
    input.value = "";
    newTaskStars = 2;
    renderStars();
  });

  $("publishBtn").addEventListener("click", generateFeedback);

  document.querySelectorAll(".bottom-nav button").forEach((btn) => {
    btn.addEventListener("click", () => showScreen(btn.dataset.screen));
  });

  $("modalCloseBtn").addEventListener("click", () => $("archiveModal").classList.remove("show"));
  $("archiveModal").addEventListener("click", (e) => {
    if (e.target.id === "archiveModal") $("archiveModal").classList.remove("show");
  });

  $("keyBanner").classList.toggle("show", !hasApiKey());

  loadState();
  renderStars();
  renderAll();

  setInterval(checkDateRollover, 60 * 1000);
})();
</script>
</body>
</html>
